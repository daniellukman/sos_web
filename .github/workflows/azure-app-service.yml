# Build Next.js (output standalone) lalu deploy ke Azure App Service setiap push ke main.
# Butuh di GitHub repo (Settings → Secrets and variables → Actions):
#   - Variable AZURE_WEBAPP_NAME           : nama App Service, mis. sos-web
#   - Secret   AZURE_WEBAPP_PUBLISH_PROFILE : isi file "Download publish profile" dari App Service
name: Deploy ke Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-app-service
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Server standalone tidak menyertakan public/ dan .next/static; salin ke paket deploy
      - name: Siapkan paket
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp deploy/start.js .next/standalone/

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .next/standalone
